# Test dashboard for stack-in-card. Each view puts the card next to Home
# Assistant's own stack with the same cards, to compare.
title: Stack in card
views:
  - title: Basics
    path: basics
    cards:
      - type: custom:stack-in-card
        title: Vertical (default)
        cards: &cards
          - type: entities
            entities:
              - light.bed_light
              - light.ceiling_lights
          - type: glance
            entities:
              - sensor.outside_temperature
              - sensor.outside_humidity
          - type: horizontal-stack
            cards:
              - type: button
                entity: light.kitchen_lights
              - type: button
                entity: switch.decorative_lights
      - type: vertical-stack
        title: Home Assistant's vertical stack
        cards: *cards
      - type: custom:stack-in-card
        title: Horizontal
        mode: horizontal
        cards: &buttons
          - type: button
            entity: light.bed_light
          - type: button
            entity: light.ceiling_lights
          - type: button
            entity: light.kitchen_lights
      - type: horizontal-stack
        cards: *buttons
      - type: custom:stack-in-card
        cards: *buttons

  - title: Nested
    path: nested
    cards:
      - type: custom:stack-in-card
        title: Nested stacks
        cards:
          - type: horizontal-stack
            cards: *buttons
          - type: vertical-stack
            cards:
              - type: entities
                entities:
                  - light.bed_light
              - type: entities
                entities:
                  - light.ceiling_lights
      - type: custom:stack-in-card
        title: Nested stack-in-card
        cards:
          - type: entities
            entities:
              - light.bed_light
          - type: custom:stack-in-card
            mode: horizontal
            cards: *buttons
      - type: custom:stack-in-card
        title: Empty (shows nothing outside the editor)
        cards: []
