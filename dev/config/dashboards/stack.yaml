# Test dashboard for stack-in-card. Each view puts the card next to Home
# Assistant's own stack with the same cards, to compare.
title: Stack in card
views:
  - title: Basics
    path: basics
    cards:
      - type: custom:stack-in-card
        title: Vertical (default)
        cards: &cards
          - type: entities
            entities:
              - light.bed_light
              - light.ceiling_lights
          - type: glance
            entities:
              - sensor.outside_temperature
              - sensor.outside_humidity
          - type: horizontal-stack
            cards:
              - type: button
                entity: light.kitchen_lights
              - type: button
                entity: switch.decorative_lights
      - type: vertical-stack
        title: Home Assistant's vertical stack
        cards: *cards
      - type: custom:stack-in-card
        title: Horizontal
        mode: horizontal
        cards: &buttons
          - type: button
            entity: light.bed_light
          - type: button
            entity: light.ceiling_lights
          - type: button
            entity: light.kitchen_lights
      - type: horizontal-stack
        cards: *buttons
      - type: custom:stack-in-card
        cards: *buttons

  - title: Keep
    path: keep
    cards:
      - type: custom:stack-in-card
        title: "keep: margin"
        keep:
          margin: true
        cards: *buttons
      - type: custom:stack-in-card
        title: "keep: margin, no outer_padding"
        keep:
          margin: true
          outer_padding: false
        cards: *buttons
      - type: custom:stack-in-card
        title: "keep: background"
        keep:
          background: true
        cards: *buttons
      - type: custom:stack-in-card
        title: "keep: border"
        keep:
          border: true
        cards: *buttons
      - type: custom:stack-in-card
        title: "keep: border_radius, border"
        keep:
          border: true
          border_radius: true
          margin: true
        cards: *buttons
      - type: custom:stack-in-card
        title: "keep: box_shadow, margin"
        keep:
          box_shadow: true
          margin: true
        cards: *buttons

  - title: Flags
    path: flags
    cards:
      - type: custom:stack-in-card
        title: --keep-background on the middle card
        mode: horizontal
        cards:
          - type: button
            entity: light.bed_light
          - type: custom:dev-flag-card
            style:
              --keep-background: "true"
              --ha-card-background: var(--primary-color)
            card:
              type: button
              entity: light.ceiling_lights
          - type: button
            entity: light.kitchen_lights
      - type: custom:stack-in-card
        title: --keep-border on the middle card
        mode: horizontal
        cards:
          - type: button
            entity: light.bed_light
          - type: custom:dev-flag-card
            style:
              --keep-border: "true"
            card:
              type: button
              entity: light.ceiling_lights
          - type: button
            entity: light.kitchen_lights

  - title: Nested
    path: nested
    cards:
      - type: custom:stack-in-card
        title: Nested stacks
        cards:
          - type: horizontal-stack
            cards: *buttons
          - type: vertical-stack
            cards:
              - type: entities
                entities:
                  - light.bed_light
              - type: entities
                entities:
                  - light.ceiling_lights
      - type: custom:stack-in-card
        title: Nested stack-in-card keeping its margin
        cards:
          - type: entities
            entities:
              - light.bed_light
          - type: custom:stack-in-card
            mode: horizontal
            keep:
              margin: true
            cards: *buttons
      - type: custom:stack-in-card
        title: Empty (shows nothing outside the editor)
        cards: []
