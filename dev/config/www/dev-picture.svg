<!-- Test picture for the Overflow view: strong colors right into the
     corners, so it's easy to see whether they follow the card's rounded
     corners -->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e91e63" />
      <stop offset="1" stop-color="#3f51b5" />
    </linearGradient>
  </defs>
  <rect width="480" height="180" fill="url(#g)" />
  <text x="240" y="100" fill="#fff" font-family="sans-serif" font-size="28" text-anchor="middle">Picture</text>
</svg>
